[package]
name = "beads_rust"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
autobenches = false
description = "Agent-first issue tracker (SQLite + JSONL)"
license = "MIT"
repository = "https://github.com/quangdang46/beads_rust"
keywords = ["cli", "issue-tracker", "sqlite", "agent"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    "sample_beads_db_files/",
    ".beads/",
    ".agent-mail.yaml",
    ".github/",
    ".claude/",
    ".ntm/",
    "agent_baseline/",
    "docs/",
    "scripts/",
    "skills/",
    "temp_test/",
    "temp_test_2/",
    "refactor/",
    "*.webp",
    "*.png",
    "*.db",
    "*.db-wal",
    "*.db-shm",
]

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5.60", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }

# Database
#
# MIGRATION IN PROGRESS: fsqlite (frankensqlite) -> rusqlite 0.40.2 bundled.
# See docs/RUSQLITE_MIGRATION_PLAN_2026_09_25.md.
#
# BOTH engines are declared here on purpose, and the fsqlite lines are NOT dead
# weight. `src/storage/sqlite.rs` keeps importing fsqlite until Phase 7, so
# dropping the declarations now would leave the tree uncompilable for six
# consecutive phases and forfeit every test signal for the whole port. The 15
# fsqlite lines are deleted in Phase 8, once no `src/` file imports fsqlite.
#
# Feature notes for the rusqlite line:
#   bundled       - compiles the vendored SQLite amalgamation via `cc`, so no
#                   pkg-config/vcpkg bootstrap. Transitively enables
#                   modern_sqlite -> bundled_bindings, which are the
#                   PREGENERATED bindings, so libclang/bindgen is NOT needed.
#   cache         - prepared-statement LRU. In the default set since 0.38, so
#                   listing it explicitly is only a guard against a future
#                   upstream default change, not a fix for a current failure.
#   fallible_uint - re-enables u64/usize ToSql/FromSql, off by default since
#                   0.38.0. The storage layer uses unsigned counters.
#   session and preupdate_hook MUST stay off. session implies preupdate_hook
#   implies buildtime_bindgen, which would pull a libclang build dependency
#   onto every build host. See docs/CI_SUPPLY_CHAIN.md.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "cache", "fallible_uint"] }

# Database, legacy engine (removed in Phase 8). frankensqlite ships an
# OpenAI/Anthropic license rider and keeps its WAL index in process memory,
# which is what makes `br doctor migrate-schema recover` permanently
# unrecoverable on Windows.
# NOTE: transitive fsqlite workspace deps listed explicitly so rch syncs them
fsqlite = "0.1.7"
fsqlite-types = "0.1.7"
fsqlite-error = "0.1.7"
fsqlite-core = "0.1.7"
fsqlite-func = "0.1.7"
fsqlite-vdbe = "0.1.7"
fsqlite-vfs = "0.1.7"
fsqlite-pager = "0.1.7"
fsqlite-parser = "0.1.7"
fsqlite-planner = "0.1.7"
fsqlite-wal = "0.1.7"
fsqlite-btree = "0.1.7"
fsqlite-ast = "0.1.7"
fsqlite-mvcc = "0.1.7"
fsqlite-observability = "0.1.7"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
csv = "1.3"
serde_yml = { package = "serde_norway", version = "0.9.42" }
schemars = { version = "1.0", features = ["derive", "chrono04"] }

# Time
chrono = { version = "0.4.43", features = ["serde"] }

# Hashing
sha2 = "0.11.0"
aes-gcm = "0.10"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

# Terminal
indicatif = "0.18.4"
crossterm = "0.29"

# Rich terminal output (sibling project). Keep syntax highlighting out of the
# release build until the upstream syntect stack drops unmaintained transitive
# crates.
rich_rust = { version = "0.2.1", features = ["markdown", "json", "backtrace"] }

# TOON format support (sibling project)
toon_rust = { version = "0.2.3", package = "tru" }

# Path normalization (strips \\?\ prefix on Windows)
dunce = "1.0.5"

# Utilities
once_cell = "1.21"
regex = "1.12"
shell-words = "1.1.1"
similar = "3.1.1"
tempfile = "3.25"
toml = "0.8"
unicode-width = "0.2.2"

# Versioning
semver = "1.0.27"

# MCP server (optional; gated behind the `mcp` feature)
fastmcp-rust = { version = "0.3.1", optional = true }

# Embedded web UI server (optional; gated behind the `web` feature)
axum = { version = "0.8", optional = true, features = ["macros"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", optional = true, features = ["cors"] }
rust-embed = { version = "8", optional = true }

# Self-update removed for RUSTSEC-2026-0194/0195. Users install via install.sh
# (https://github.com/quangdang46/beads_rust#installation).

# Cooperative shutdown so SIGINT/SIGTERM/SIGHUP unwind through main and let
# SqliteStorage::Drop flush the WAL instead of stranding frames on disk (#270).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4.4"

[target.'cfg(not(windows))'.dependencies]
mimalloc = "0.1.52"

[build-dependencies]
vergen-gix = { version = "9.1", features = ["build", "cargo", "rustc"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
criterion = { version = "0.8.2", features = ["html_reports"] }
walkdir = "2.5"
insta = { version = "1.46", features = ["json", "yaml"] }
proptest = "1.10"
rand = "0.10"

[[bench]]
name = "storage_perf"
path = "benches/storage_perf.rs"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "thin"
debug = "line-tables-only"
strip = false

[profile.dev]
opt-level = 1

[features]
default = ["web"]
mcp = ["dep:fastmcp-rust"]
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:rust-embed"]

# NOTE: no `[patch.crates-io]` here.
#
# All dependencies — fsqlite 0.1.3+, its fsqlite-* transitive crates, and
# fastmcp-rust 0.3.1+ — are published on crates.io, so this crate
# resolves everything from the registry out of the box.  That makes
# `cargo install --git https://github.com/quangdang46/beads_rust.git`
# work without requiring sibling `frankensqlite` or `fastmcp_rust`
# checkouts (issue #250 bug 1).
#
# Local co-development: contributors who want to hack on frankensqlite
# or fastmcp_rust alongside beads_rust can add a workspace-level
# `.cargo/config.toml` with their own `[patch.crates-io]` table.  See
# `scripts/dev-local-frankensqlite.toml` for a ready-to-copy template.

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Allow these lints to unblock CI (need higher priority than groups)
cast_precision_loss = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
missing_const_for_fn = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
useless_let_if_seq = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
# Stylistic nursery/pedantic lints that don't reflect real defects
option_if_let_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
too_long_first_doc_paragraph = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
redundant_clone = { level = "allow", priority = 1 }
struct_excessive_bools = { level = "allow", priority = 1 }
if_not_else = { level = "allow", priority = 1 }
