name: CI

on:
  push:
    branches: [main, dev]
    # Tag pushes ran nothing before, so `git tag vX && git push --tags`
    # shipped a commit no test had ever built. Releasing is gated in
    # release.yml too; this trigger means a bad tag is caught before the
    # release job starts rather than after it has built five binaries.
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional. frankensqlite's WAL-index quarantine is
        # unimplemented there, and src/sync/path.rs kept `std::os::unix`
        # calls in test code — a single-OS matrix let the whole `lib` test
        # target fail to compile on Windows while CI stayed green.
        os: [ubuntu-latest, windows-latest, macos-latest]
    # Measured budget: on macos-latest the 137 test binaries execute in 4.2
    # minutes; the step takes ~55 wall-clock because it compiles and links
    # every one of them, and ubuntu-latest was still linking when the old
    # 90-minute job timeout killed it — the step never reported a conclusion,
    # so the run was indistinguishable from a hang. `[profile.test]` in
    # Cargo.toml now carries `debug = "line-tables-only"`, which is most of
    # the fix; the headroom here absorbs the remainder plus cache misses on
    # a cold runner.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # nightly
        with:
          # This pin made `toolchain` a required input and dropped the
          # rust-toolchain.toml fallback. Without it the step died in ~10s with
          # "'toolchain' is a required input", so every step after it was
          # skipped and CI had never once reached the tests. audit.yml already
          # passed this; ci.yml did not.
          toolchain: nightly
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build web UI assets
        run: bash scripts/build-web.sh
      # `--locked` everywhere: without it CI is free to resolve a different
      # dependency set than the committed Cargo.lock, so a green run says
      # nothing about the tree that actually gets released.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (advisory)
        # Reports, but does not gate. The crate's `[lints.rust]` section denies
        # several lints that current nightly clippy newly flags, so this fails
        # on ~296 pre-existing violations in files unrelated to any change.
        # Clearing that is a deliberate cleanup, not something to land
        # silently inside a CI change.
        run: cargo clippy --locked --all-features --all-targets
        continue-on-error: true
      - name: Build
        # Library + binary only. This used to be `--all-targets`, which links
        # all ~174 test binaries and benches — and then the test job builds
        # every one of them again. On a 2-core runner that duplicate link
        # stage is what killed the job (ubuntu died 23 min in, with this step
        # never reporting a conclusion).
        run: cargo build --locked --all-features

  # The suite is split across a shard matrix because the cost is linking, not
  # running: the 137 test binaries execute in ~4 minutes on macOS and ~4 on
  # Linux, while the step that links them is measured at 21 min on
  # ubuntu-latest, 33 on macos-latest, and >124 on windows-latest — where it
  # was still going when the 150-minute job timeout cancelled it. A single
  # `cargo test` therefore cannot finish on the slowest runner, and raising
  # the timeout far enough to let it would mean a four-hour Windows job.
  #
  # Sharding is the lever that actually reduces the work: each job links a
  # third of the test binaries instead of all of them, which brings every OS
  # comfortably inside the budget and makes the matrix run in the wall-clock
  # time of its slowest shard. The library, binary and doc-test targets ride
  # along with shard 0 so they are still compiled and run exactly once.
  test:
    name: Test (${{ matrix.os }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [0, 1, 2]
        shards: [3]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build web UI assets
        run: bash scripts/build-web.sh
      # A bare `cargo test` also covers lib, bins and doc tests, none of which
      # has a `tests/*.rs` file of its own and so none of which the shard loop
      # can see. They are requested explicitly on shard 0.
      #
      # Doc tests get their own invocation because cargo refuses to mix them
      # with anything else: `--doc` alongside `--lib --test X` fails with
      # "can't mix --doc with other target selecting options". Verified rather
      # than assumed — that combination was in the first draft of this step.
      #
      # The loop is POSIX sh, not bash: macOS ships bash 3.2 and this runs on
      # all three OSes. `mapfile` here would fail on macOS exactly the way the
      # doctor fixture suite used to.
      # `--no-fail-fast` runs every test binary so one shard reports all of its
      # failures rather than only the first.
      - name: Test (shard ${{ matrix.shard }}/${{ matrix.shards }})
        # Required, and not a nicety: on windows-latest a bare `run:` block is
        # handed to PowerShell, which cannot parse this script at all. The
        # first version of this step omitted it and all three Windows shards
        # died in zero minutes with
        #   ParserError: Missing '(' after 'if' in if statement.
        # Git Bash is present on the runner, so `shell: bash` gives all three
        # OSes one shell. Bash 3.2 on macOS is still why the loop avoids
        # `mapfile` — the same trap that took out the doctor fixture suite.
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
        run: |
          set -eu
          if [ "$SHARD" -eq 0 ]; then
            set -- --lib --bins
          else
            set --
          fi
          i=0
          for f in tests/*.rs; do
            name=$(basename "$f" .rs)
            if [ $((i % SHARDS)) -eq "$SHARD" ]; then
              set -- "$@" --test "$name"
            fi
            i=$((i + 1))
          done
          echo "targets:$*"
          cargo test --locked --all-features --no-fail-fast "$@"
          if [ "$SHARD" -eq 0 ]; then
            cargo test --locked --all-features --doc
          fi
