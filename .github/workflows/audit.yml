name: Security Audit

on:
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    # A dependency bump that lands via PR is exactly the case an audit is for;
    # without this trigger a vulnerable dep is only caught by the nightly cron.
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: nightly

      - name: Install cargo-audit
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9  # v2.82.2
        with:
          tool: cargo-audit

      - name: Security audit (advisories, non-blocking)
        # Policy: known advisories are reported, not enforced. This step used to
        # pass `--deny warnings` and then immediately set `continue-on-error`,
        # so the strict flag was dead code and the step could never fail —
        # reading as if advisories were gated when nothing was gated.
        # A yanked dependency, by contrast, is a hard failure below.
        run: cargo audit
        continue-on-error: true

      - name: Check for yanked dependencies
        run: cargo audit --deny yanked
