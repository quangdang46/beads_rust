name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    # The `release` job already read `inputs.reliability_override*`, but no
    # `workflow_dispatch` inputs were declared, so both were permanently
    # empty and the documented emergency override was unreachable. Declaring
    # them makes that path real.
    inputs:
      reliability_override:
        description: "Bypass the reliability gate (emergency only: skip | force)"
        required: false
        default: ""
        type: string
      reliability_override_reason:
        description: "Written justification, recorded in the release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  # The release used to build five binaries and publish them without ever
  # compiling a test, and ci.yml did not trigger on tag pushes — so
  # `git tag vX && git push --tags` shipped whatever was on the tree, tested
  # or not. This gate runs the full suite against the tagged commit before a
  # single artifact is produced.
  gate:
    name: Reliability gate
    runs-on: ubuntu-latest
    # Same measured budget as ci.yml's `check` job, and for the same reason:
    # the suite executes in ~4 minutes but compiling and linking its 137 test
    # binaries dominates, and this gate runs on ubuntu — the runner that was
    # still linking when ci.yml's old 90-minute timeout fired. `[profile.test]`
    # in Cargo.toml (`debug = "line-tables-only"`) is most of the fix.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build web UI assets
        run: bash scripts/build-web.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (advisory)
        # Reports, but does not gate — see ci.yml for why: the crate denies
        # lints that current nightly clippy newly flags, failing on ~296
        # pre-existing violations unrelated to any change.
        run: cargo clippy --locked --all-features --all-targets
        continue-on-error: true
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
        # The documented emergency path: an operator may push through a broken
        # gate, but only by supplying a reason, which the release job below
        # refuses to accept without and then records in the release notes.
        continue-on-error: ${{ inputs.reliability_override != '' }}

  # Native musl builds — avoid `cargo install cross` which currently fails to
  # compile on latest nightly (eyre::bail trailing-semicolon hard errors).
  linux-x64:
    name: linux-x64
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build embedded web UI
        run: bash scripts/build-web.sh
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          mkdir -p artifacts
          tar czf artifacts/br-linux-x64.tar.gz -C target/x86_64-unknown-linux-musl/release br
          # The sidecar must name the bare file, not artifacts/<file>:
          # the release job verifies it with `cd artifacts && sha256sum -c`.
          (cd artifacts && sha256sum br-linux-x64.tar.gz > br-linux-x64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-linux-x64
          path: artifacts/br-linux-x64.*
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    needs: [gate]
    # Native ARM runner — no cross-compilation / no cross crate.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build embedded web UI
        run: bash scripts/build-web.sh
      - run: cargo build --locked --release --target aarch64-unknown-linux-musl
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          mkdir -p artifacts
          tar czf artifacts/br-linux-arm64.tar.gz -C target/aarch64-unknown-linux-musl/release br
          # The sidecar must name the bare file, not artifacts/<file>:
          # the release job verifies it with `cd artifacts && sha256sum -c`.
          (cd artifacts && sha256sum br-linux-arm64.tar.gz > br-linux-arm64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-linux-arm64
          path: artifacts/br-linux-arm64.*
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    needs: [gate]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build embedded web UI
        run: bash scripts/build-web.sh
      - run: cargo build --locked --release --target aarch64-apple-darwin
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          mkdir -p artifacts
          tar czf artifacts/br-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release br
          # The sidecar must name the bare file, not artifacts/<file>:
          # the release job verifies it with `cd artifacts && sha256sum -c`.
          (cd artifacts && shasum -a 256 br-macos-arm64.tar.gz > br-macos-arm64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-macos-arm64
          path: artifacts/br-macos-arm64.*
          if-no-files-found: error

  macos-x64:
    name: macos-x64
    needs: [gate]
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build embedded web UI
        run: bash scripts/build-web.sh
      - run: cargo build --locked --release --target x86_64-apple-darwin
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          mkdir -p artifacts
          tar czf artifacts/br-macos-x64.tar.gz -C target/x86_64-apple-darwin/release br
          # The sidecar must name the bare file, not artifacts/<file>:
          # the release job verifies it with `cd artifacts && sha256sum -c`.
          (cd artifacts && shasum -a 256 br-macos-x64.tar.gz > br-macos-x64.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-macos-x64
          path: artifacts/br-macos-x64.*
          if-no-files-found: error

  windows-x64:
    name: windows-x64
    needs: [gate]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build embedded web UI
        run: bash scripts/build-web.sh
      - run: cargo build --locked --release --target x86_64-pc-windows-msvc
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          7z a artifacts\br-windows-x64.zip target\x86_64-pc-windows-msvc\release\br.exe
          # certutil prints headers and a trailing status line; the sidecar has to
          # be the bare "<64-hex>  <file>" form, because the release job verifies
          # it with `cd artifacts && sha256sum -c`.
          $hash = (certutil -hashfile artifacts\br-windows-x64.zip SHA256 |
                   Select-String -Pattern '^[0-9a-fA-F]{64}$').ToString().Trim().ToLower()
          "$hash  br-windows-x64.zip" | Out-File -Encoding ascii -NoNewline artifacts\br-windows-x64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: br-windows-x64
          path: artifacts/br-windows-x64.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: artifacts

      # --- Supply-chain gates -------------------------------------------------
      # Everything below runs against the artifacts the build jobs uploaded,
      # which land in the workspace root because download-artifact uses
      # merge-multiple. Asset names are tagless (br-macos-arm64.tar.gz, ...),
      # matching install.sh and packaging/homebrew/br.rb.

      - name: Validate reliability override
        # Only reached when an operator actually asked to bypass the gates;
        # the step itself then refuses to proceed without a written reason.
        if: ${{ inputs.reliability_override != '' }}
        env:
          RELIABILITY_OVERRIDE: ${{ inputs.reliability_override }}
          RELIABILITY_OVERRIDE_REASON: ${{ inputs.reliability_override_reason || '' }}
        run: |
          set -euo pipefail
          if [ -z "${RELIABILITY_OVERRIDE_REASON:-}" ]; then
            echo "reliability_override_reason is required"
            echo "::error::reliability_override_reason is required"
            exit 1
          fi
          # The reason is the record; the mode defaults to `skip` when the
          # operator gave only a justification, which is the documented
          # emergency path.
          case "${RELIABILITY_OVERRIDE:-skip}" in
            ""|force|skip) ;;
            *) echo "::error::unknown reliability_override '${RELIABILITY_OVERRIDE:-}'"; exit 1 ;;
          esac
          summary="${GITHUB_STEP_SUMMARY:-reliability-override.md}"
          {
            echo "### Reliability override"
            echo ""
            echo "Reliability gates were explicitly skipped by a documented operator emergency."
            echo ""
            echo "- override: \`${RELIABILITY_OVERRIDE:-skip}\`"
            echo "- reason: ${RELIABILITY_OVERRIDE_REASON:-}"
          } > "$summary"
          cat "$summary"

      - name: Validate required artifacts present
        run: |
          set -euo pipefail
          # The gates operate on the staged artifacts directory, which is where
          # the build jobs write and where download-artifact put them.
          cd artifacts
          REQUIRED_ARTIFACTS_STR="${REQUIRED_ARTIFACTS_STR:-br-macos-arm64.tar.gz br-macos-x64.tar.gz br-linux-x64.tar.gz br-linux-arm64.tar.gz br-windows-x64.zip}"
          # shellcheck disable=SC2206
          REQUIRED_ARTIFACTS=( $REQUIRED_ARTIFACTS_STR )
          missing=0
          for asset in "${REQUIRED_ARTIFACTS[@]}"; do
            if [ ! -f "$asset" ]; then
              echo "::error::missing required artifact $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::release aborted: required artifacts missing"
            exit 1
          fi
          echo "All required platform artifacts present"

      - name: Generate combined checksums
        run: |
          set -euo pipefail
          # The gates operate on the staged artifacts directory, which is where
          # the build jobs write and where the original workflow kept them.
          cd artifacts
          combined="./.checksums.sha256.tmp"
          : > "$combined"
          find . -maxdepth 1 -type f -name '*.sha256' \
               ! -name 'checksums.sha256' ! -name '.checksums.sha256.tmp' \
               -exec cat {} + > "$combined"
          mv -f "$combined" checksums.sha256
          echo "=== Combined checksums ==="
          cat checksums.sha256

      - name: Verify all checksums
        run: |
          set -euo pipefail
          cd artifacts
          echo "=== Verifying all checksums ==="
          # `find -exec` would swallow sha256sum's exit status, so loop over the
          # NUL-delimited list in the shell and let `set -e` abort on the first
          # sidecar that does not verify.
          while IFS= read -r -d '' checksum_file; do
            echo "Verifying ${checksum_file#./}..."
            sha256sum -c "$checksum_file"
          done < <(find . -maxdepth 1 -type f -name '*.sha256' ! -name 'checksums.sha256' -print0)
          echo "All checksums verified"

      - name: Sign archive with Ed25519 (Linux/macOS)
        if: runner.os != 'Windows' && env.MINISIGN_SECRET_KEY != ''
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          cd artifacts
          signing_key="$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/minisign-key.XXXXXX")"
          trap 'rm -f "$signing_key"' EXIT
          chmod 600 "$signing_key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$signing_key"
          signed=0
          for asset in br-macos-arm64.tar.gz br-macos-x64.tar.gz \
                        br-linux-x64.tar.gz br-linux-arm64.tar.gz; do
            if [ ! -f "$asset" ]; then
              echo "::error::cannot sign missing artifact $asset"
              exit 1
            fi
            minisign -Sm "$asset" -s "$signing_key" -x "${asset}.minisig"
            echo "Signed $asset"
            signed=$((signed + 1))
          done
          if [ "$signed" -ne 4 ]; then
            echo "::error::expected to sign 4 archives, signed $signed"
            exit 1
          fi
          echo "Signed $signed archives"

      - name: Generate changelog
        run: |
          {
            echo "## br v${GITHUB_REF_NAME#v}"
            echo ""
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if git rev-parse --verify HEAD~20 >/dev/null 2>&1; then
              echo "Changes in HEAD~20..HEAD:"
              git --no-pager log --oneline HEAD~20..HEAD --no-merges
              echo ""
            fi
            if [ -n "$previous_tag" ]; then
              echo "Previous release: ${previous_tag}"
              echo ""
            else
              echo "No previous tag found; this is the first release."
              echo ""
            fi
            if [ -f CHANGELOG.md ]; then
              # Extract the section for this version from CHANGELOG.md
              awk -v ver="${GITHUB_REF_NAME}" '
                $0 ~ "^## " ver " " {grab=1; next}
                grab && /^## / {exit}
                grab {print}
              ' CHANGELOG.md
              echo ""
            fi
            echo "### Reliability"
            if [ -f reliability-override.md ]; then
              # The override step wrote the operator's justification. Spell the
              # outcome out here too, so the release note reads unambiguously
              # whether a human reviewed this release or waived the gates.
              echo "Reliability gates were explicitly skipped by a documented operator emergency."
              echo ""
              cat reliability-override.md
              echo ""
            else
              echo "Reliability gates were explicitly not skipped for this release."
              echo ""
            fi
            echo "Release reliability gates completed before artifacts were built."
            echo ""
            echo "### Downloads"
            for f in artifacts/br-*.tar.gz artifacts/br-*.sha256 \
                     artifacts/br-*.zip artifacts/br-*.minisig; do
              if [ -f "$f" ]; then
                echo "- \`$(basename "$f")\`"
              fi
            done
          } > release.md

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: release.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            artifacts/br-*.tar.gz
            artifacts/br-*.sha256
            artifacts/br-*.zip
            artifacts/br-*.minisig
            artifacts/checksums.sha256

      - name: Upload build artifacts (manual dispatch fallback)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: br-release-artifacts
          path: |
            artifacts/br-*.tar.gz
            artifacts/br-*.sha256
            artifacts/br-*.zip
            artifacts/br-*.minisig
            artifacts/checksums.sha256
          if-no-files-found: error
