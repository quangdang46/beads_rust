name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'linux-musl')
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux musl)
        if: contains(matrix.target, 'linux-musl')
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Build (native)
        if: "!contains(matrix.target, 'linux-musl')"
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTC_BOOTSTRAP: 1

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../br-${{ matrix.suffix }}.tar.gz br
          cd -
          sha256sum br-${{ matrix.suffix }}.tar.gz > br-${{ matrix.suffix }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../br-${{ matrix.suffix }}.zip br.exe
          cd -
          certutil -hashfile br-${{ matrix.suffix }}.zip SHA256 > br-${{ matrix.suffix }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: br-${{ matrix.suffix }}
          path: |
            br-${{ matrix.suffix }}.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          echo "## br v${GITHUB_REF_NAME#v}" >> release.md
          echo "" >> release.md
          echo "### Downloads" >> release.md
          for f in br-*.tar.gz br-*.zip br-*.sha256; do
            [ -f "$f" ] && echo "- $f" >> release.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            br-*.tar.gz
            br-*.zip
            br-*.sha256
