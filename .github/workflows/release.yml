name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Native musl builds — avoid `cargo install cross` which currently fails to
  # compile on latest nightly (eyre::bail trailing-semicolon hard errors).
  linux-x64:
    name: linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
        env:
          RUSTC_BOOTSTRAP: 1
      - run: cd target/x86_64-unknown-linux-musl/release && tar czf ../../../br-linux-x64.tar.gz br && cd - && sha256sum br-linux-x64.tar.gz > br-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: br-linux-x64
          path: br-linux-x64.*
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    # Native ARM runner — no cross-compilation / no cross crate.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target aarch64-unknown-linux-musl
        env:
          RUSTC_BOOTSTRAP: 1
      - run: cd target/aarch64-unknown-linux-musl/release && tar czf ../../../br-linux-arm64.tar.gz br && cd - && sha256sum br-linux-arm64.tar.gz > br-linux-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: br-linux-arm64
          path: br-linux-arm64.*
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-apple-darwin
        env:
          RUSTC_BOOTSTRAP: 1
      - run: cd target/aarch64-apple-darwin/release && tar czf ../../../br-macos-arm64.tar.gz br && cd - && shasum -a 256 br-macos-arm64.tar.gz > br-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: br-macos-arm64
          path: br-macos-arm64.*
          if-no-files-found: error

  macos-x64:
    name: macos-x64
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-apple-darwin
        env:
          RUSTC_BOOTSTRAP: 1
      - run: cd target/x86_64-apple-darwin/release && tar czf ../../../br-macos-x64.tar.gz br && cd - && shasum -a 256 br-macos-x64.tar.gz > br-macos-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: br-macos-x64
          path: br-macos-x64.*
          if-no-files-found: error

  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target x86_64-pc-windows-msvc
        env:
          RUSTC_BOOTSTRAP: 1
      - run: |
          cd target/x86_64-pc-windows-msvc/release
          7z a ../../../br-windows-x64.zip br.exe
          cd -
          certutil -hashfile br-windows-x64.zip SHA256 > br-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: br-windows-x64
          path: br-windows-x64.*
          if-no-files-found: error

  release:
    name: Create Release
    needs: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate release notes
        run: |
          {
            echo "## br v${GITHUB_REF_NAME#v}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              # Extract the section for this version from CHANGELOG.md
              awk -v ver="${GITHUB_REF_NAME}" '
                $0 ~ "^## " ver " " {grab=1; next}
                grab && /^## / {exit}
                grab {print}
              ' CHANGELOG.md
              echo ""
            fi
            echo "### Downloads"
            for f in br-*.tar.gz br-*.sha256 br-*.zip; do
              [ -f "$f" ] && echo "- \`$f\`"
            done
          } > release.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            br-*.tar.gz
            br-*.sha256
            br-*.zip
